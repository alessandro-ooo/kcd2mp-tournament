<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Welcome</title>
<link rel="stylesheet" href="../basicrp.css">
<link rel="stylesheet" href="welcome.css">
</head>
<body>
<section class="window" aria-label="Welcome">
  <header>
    <h1 id="title">Welcome</h1>
  </header>
  <div id="body">
    <p class="lead">Before you enter, read the realm's rules.</p>
    <ol id="rules"></ol>
    <label for="answer" id="ask">Type <b id="word">agree</b> to accept them:</label>
    <div id="row">
      <input id="answer" autofocus autocomplete="off" spellcheck="false" maxlength="32">
      <button class="action" id="enter" type="button">Enter the realm</button>
    </div>
    <p id="wrong" hidden></p>
  </div>
  <footer>
    <span>Then log in with your password.</span>
  </footer>
</section>
<script src="welcome.js"></script>
</body>
</html>
