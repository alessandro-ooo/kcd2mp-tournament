<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scoreboard</title>
<link rel="stylesheet" href="board.css">
</head>
<body>
<section id="board" hidden>
  <header>
    <h1 id="title"></h1>
    <span id="count"></span>
    <button id="close" type="button" tabindex="-1" aria-label="Close">&times;</button>
  </header>
  <table>
    <thead><tr id="head"></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <footer id="pages"></footer>
</section>
<!-- The page SDK for opening this page in a browser (mock mode). In the game, the game's own SDK is already there and this copy steps aside. -->
<script src="../sdk.js"></script>
<script src="board.js"></script>
</body>
</html>
