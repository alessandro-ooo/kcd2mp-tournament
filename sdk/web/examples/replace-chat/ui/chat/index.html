<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chat</title>
<link rel="stylesheet" href="chat.css">
</head>
<body>
<section id="chat" hidden>
  <div id="lines" role="log" aria-live="polite"></div>
  <div id="newer" hidden></div>
  <div id="entry" hidden>
    <div id="channels" role="tablist"></div>
    <input id="input" type="text" autocomplete="off" spellcheck="false" placeholder="Enter sends, Esc closes, Tab switches the channel">
    <ul id="suggestions" hidden></ul>
  </div>
</section>
<!-- The page SDK for opening this page in a browser (mock mode). In the game, the game's own SDK is already there and this copy steps aside. -->
<script src="../sdk.js"></script>
<script src="chat.js"></script>
</body>
</html>
